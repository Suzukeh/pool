[package]
name = "pool-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = "2"
pool-timeline-model = { path = "../../../crates/timeline-model" }
pool-render-core = { path = "../../../crates/render-core" }
pool-ffmpeg-io = { path = "../../../crates/ffmpeg-io" }
pool-plugin-host = { path = "../../../crates/plugin-host" }
pool-plugin-sdk = { path = "../../../crates/plugin-sdk" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
